mode: paper   # hard-locked; "live" will raise ValueError in code
account: DUH860616

ibkr:
  host: "127.0.0.1"
  port: 4002
  data_client_id: 150
  exec_client_id: 151
  account: "DUH860616"

# Execution route: "ninjatrader" places real bracket orders on the NT sim
# account via the WinRM bridge (data still comes from IBKR). "ibkr" keeps the
# legacy IBKR paper-account execution + bar-touch reconciliation.
execution:
  route: ninjatrader          # ninjatrader | ibkr

# NinjaTrader bridge — only used when execution.route == "ninjatrader".
# WinRM → PowerShell → NT Client API on the Windows host. Password from env
# WINDOWS_PASSWORD (set in the systemd unit), never committed here.
ninjatrader:
  account: SimJudasCrew       # NT sim account (separate sleeve from workshop's SimJUDAS)
  host: 100.108.151.36        # Tailscale IP of the Windows NT box
  user: nqtrader
  python_exe: "C:\\Users\\hartw\\AppData\\Local\\Microsoft\\WindowsApps\\python.exe"
  outgoing_dir: "C:\\Users\\hartw\\Documents\\NinjaTrader 8\\outgoing"
  fill_timeout_s: 15
  fill_poll_s: 1.0
  # Logical symbol → NT instrument string ("ROOT MM-YY"). Front months as of
  # 2026-05-30; MNQ/MCL/DX June contracts roll ~mid-June — update at roll.
  # ZF/6J are best-effort: verify the NT sim data feed carries them.
  instrument_map:
    MGC: "MGC 06-26"
    MNQ: "MNQ 06-26"
    MBT: "MBT 06-26"
    MET: "MET 06-26"
    MCL: "MCL 07-26"
    DX:  "DX 06-26"
    ZF:  "ZF 06-26"
    "6J": "6J 06-26"

symbols:
  - symbol: MGC
    tick: 0.10
    dollar_per_point: 10.0
    timeframe: "1 hour"
  - symbol: MNQ
    tick: 0.25
    dollar_per_point: 2.0
    timeframe: "1 hour"

strategy:
  judas:
    confirmation_bars: 4       # CHoCH within N bars after sweep (1H bars, tighter than 5m)
    pivot_length: 2
    target_r: 2.0
    stop_buffer_ticks: 2
    min_sweep_ticks: 3         # sweep must be at least 3 ticks beyond level to count

risk:
  max_contracts: 1
  max_open_positions: 12
  max_trades_per_day: 24
  atr_contraction_min_ratio: 0.60
  min_displacement_strength: 1.50
  min_displacement_body_ratio: 0.50
  max_sweep_age_bars: 2
  flatten_before_daily_close_minutes: 5

crew:
  llm_model: "MiniMax-M2.7"
  llm_base_url: "https://api.minimax.io/v1"
  llm_provider: "openai"
  llm_reasoning_split: true
  verbose: true
  min_quality_score: 6          # SetupEvaluator must score >= this to proceed

db_path: judas_crew.db

schedule:
  # Strategy entry windows (ET). Whenever Globex is open. The agent team
  # decides per-trade; we don't pre-narrow to NY-only hours.
  active_sessions:
    - {start: "18:00", end: "23:59", name: "globex_evening"}   # Sun-Thu evening through ET midnight
    - {start: "00:00", end: "16:00", name: "globex_day"}        # Daily through close (16:00 ET = daily 1h break)
  hard_flat_deadline: "16:45"
  daily_reset: "17:00"
